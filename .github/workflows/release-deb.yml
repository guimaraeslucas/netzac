name: Release Debian package

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading "v" (for example 1.0.0)'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: write

concurrency:
  group: release-deb-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-deb:
    name: Build and publish .deb
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A release published from a tag that already got a .deb does not need a rebuild.
    if: github.event_name != 'release' || !contains(join(github.event.release.assets.*.name, ','), '.deb')
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = release ]; then
            tag=$REF_NAME
          else
            tag=v${INPUT_VERSION#v}
          fi
          version=${tag#v}
          case "$version" in
            [0-9]*) ;;
            *) echo "::error::Version '$version' must start with a digit."; exit 1 ;;
          esac
          case "$version" in
            *[!A-Za-z0-9.+~]*) echo "::error::Version '$version' contains invalid characters."; exit 1 ;;
          esac
          printf 'tag=%s\nversion=%s\n' "$tag" "$version" >> "$GITHUB_OUTPUT"

      - name: Build Debian package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          script=$(cat <<'EOF'
          set -eux
          trap 'chown -R "$HOST_UID:$HOST_GID" build 2>/dev/null || true' EXIT
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates dpkg-dev git gettext meson ninja-build \
            pkg-config qt6-base-dev qt6-webengine-dev xz-utils
          git config --global --add safe.directory /src
          ./scripts/build-deb.sh "$VERSION"
          EOF
          )
          docker run --rm \
            -e VERSION \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            debian:trixie \
            bash -c "$script"

      - name: Publish release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          deb=$(find build/packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          if [ -z "$deb" ]; then
            echo "::error::The build did not produce a .deb file."
            exit 1
          fi
          package_version=$(dpkg-deb -f "$deb" Version)
          if [ "$package_version" != "$VERSION" ]; then
            echo "::error::The package version is '$package_version', expected '$VERSION'."
            exit 1
          fi
          if ! dpkg-deb -f "$deb" Depends | grep -q 'libqt6'; then
            echo "::error::The package is missing its Qt 6 runtime dependencies."
            exit 1
          fi

          deb_dir=$(dirname "$deb")
          deb_name=$(basename "$deb")
          (cd "$deb_dir" && sha256sum "$deb_name" > "$deb_name.sha256")

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets."
          elif git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            gh release create "$TAG" \
              --title "Netzac Navigator $VERSION" \
              --generate-notes
          else
            gh release create "$TAG" \
              --title "Netzac Navigator $VERSION" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$TAG" "$deb" "$deb.sha256" --clobber
