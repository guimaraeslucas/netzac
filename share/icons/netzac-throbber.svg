<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Sky and dark planet-horizon gradients matching NetzacThrobber -->
    <linearGradient id="netzac-sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020510"/>
      <stop offset="48%" stop-color="#051326"/>
      <stop offset="76%" stop-color="#0c2f42"/>
      <stop offset="100%" stop-color="#020710"/>
    </linearGradient>

    <linearGradient id="netzac-ground-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2530"/>
      <stop offset="45%" stop-color="#05131c"/>
      <stop offset="100%" stop-color="#02060c"/>
    </linearGradient>

    <linearGradient id="netzac-comet-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ccf6ff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#64c8e6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2878a0" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="netzac-viewport-clip">
      <rect x="6" y="6" width="52" height="52"/>
    </clipPath>

    <style>
      @keyframes netzac-comet-a {
        0%   { transform: translate(22px, -11px); opacity: 0; }
        15%  { opacity: 0.95; }
        85%  { opacity: 0.95; }
        100% { transform: translate(-44px, 22px); opacity: 0; }
      }
      @keyframes netzac-comet-b {
        0%   { transform: translate(20px, -10px); opacity: 0; }
        18%  { opacity: 0.85; }
        82%  { opacity: 0.85; }
        100% { transform: translate(-40px, 20px); opacity: 0; }
      }
      @keyframes netzac-twinkle {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 1.0; }
      }
      .comet-1 { animation: netzac-comet-a 2.4s linear infinite; }
      .comet-2 { animation: netzac-comet-b 2.4s linear -0.6s infinite; }
      .comet-3 { animation: netzac-comet-a 2.4s linear -1.2s infinite; }
      .comet-4 { animation: netzac-comet-b 2.4s linear -1.8s infinite; }
      .star-a  { animation: netzac-twinkle 2.4s ease-in-out infinite; }
      .star-b  { animation: netzac-twinkle 2.4s ease-in-out -0.8s infinite; }
      .star-c  { animation: netzac-twinkle 2.4s ease-in-out -1.6s infinite; }
    </style>
  </defs>

  <!-- 1. ZacOS 9 Platinum bevel frame -->
  <g id="bevel-frame" shape-rendering="crispEdges">
    <rect x="0" y="0" width="64" height="64" fill="#cccccc"/>
    <!-- Outer bevel -->
    <path d="M0 0 H63 V1 H1 V63 H0 Z" fill="#888888"/>
    <path d="M1 63 H63 V1 H64 V64 H1 Z" fill="#444444"/>
    <!-- Inner bevel -->
    <path d="M1 1 H62 V2 H2 V62 H1 Z" fill="#ffffff"/>
    <path d="M2 62 H62 V2 H63 V63 H2 Z" fill="#999999"/>
    <!-- Recessed inner frame border -->
    <rect x="5" y="5" width="54" height="54" fill="none" stroke="#000000" stroke-width="1"/>
  </g>

  <!-- Clipped inner space scene -->
  <g clip-path="url(#netzac-viewport-clip)">
    <!-- 2. Cosmic night sky -->
    <g id="sky">
      <rect x="6" y="6" width="52" height="52" fill="url(#netzac-sky-grad)"/>
    </g>

    <!-- 3. Twinkling starry sky -->
    <g id="stars" shape-rendering="crispEdges">
      <rect class="star-a" x="14" y="12" width="1" height="1" fill="#85b8cc"/>
      <rect class="star-b" x="23" y="10" width="1" height="1" fill="#e6f7ff"/>
      <rect class="star-c" x="38" y="11" width="1" height="1" fill="#85b8cc"/>
      <rect class="star-a" x="49" y="14" width="1" height="1" fill="#e6f7ff"/>
      <rect class="star-b" x="17" y="20" width="1" height="1" fill="#d8f4ff"/>
      <rect class="star-c" x="31" y="18" width="1" height="1" fill="#85b8cc"/>
      <rect class="star-a" x="44" y="21" width="1" height="1" fill="#85b8cc"/>
      <rect class="star-b" x="53" y="24" width="1" height="1" fill="#85b8cc"/>
      <rect class="star-c" x="11" y="29" width="1" height="1" fill="#85b8cc"/>
      <rect class="star-a" x="26" y="28" width="1" height="1" fill="#e6f7ff"/>
      <rect class="star-b" x="40" y="30" width="1" height="1" fill="#85b8cc"/>
      <rect class="star-c" x="50" y="33" width="1" height="1" fill="#d8f4ff"/>
    </g>

    <!-- 4. Subtle comets streaking diagonally behind the Z -->
    <g id="comets">
      <g class="comet-1">
        <line x1="42" y1="14" x2="54" y2="8" stroke="url(#netzac-comet-grad)" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="42" cy="14" r="1.1" fill="#ffffff"/>
      </g>
      <g class="comet-2">
        <line x1="46" y1="22" x2="56" y2="17" stroke="url(#netzac-comet-grad)" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="46" cy="22" r="1.0" fill="#ffffff"/>
      </g>
      <g class="comet-3">
        <line x1="36" y1="11" x2="47" y2="5.5" stroke="url(#netzac-comet-grad)" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="36" cy="11" r="1.05" fill="#ffffff"/>
      </g>
      <g class="comet-4">
        <line x1="48" y1="29" x2="57" y2="24.5" stroke="url(#netzac-comet-grad)" stroke-width="1.3" stroke-linecap="round"/>
        <circle cx="48" cy="29" r="0.95" fill="#ffffff"/>
      </g>
    </g>

    <!-- 5. Darker curved planet ground / horizon -->
    <g id="horizon">
      <ellipse cx="32" cy="67" rx="44" ry="26" fill="url(#netzac-ground-grad)"/>
      <path d="M5 47 A44 26 0 0 1 59 47" fill="none" stroke="#3c8d94" stroke-width="1"/>
      <path d="M14 44.5 A44 26 0 0 1 50 44.5" fill="none" stroke="#78d4d8" stroke-width="1"/>
    </g>

    <!-- 6. Monumental serif Z planted directly on the dark horizon -->
    <g id="letter-z">
      <text x="33" y="45" text-anchor="middle" font-family="'Times New Roman', 'Nimbus Roman', Georgia, serif" font-size="38" font-weight="bold" fill="#000000">Z</text>
      <text x="32" y="44" text-anchor="middle" font-family="'Times New Roman', 'Nimbus Roman', Georgia, serif" font-size="38" font-weight="bold" fill="#ffffff">Z</text>
    </g>
  </g>
</svg>
