<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f5656"/>
      <stop offset="55%" stop-color="#1b3068"/>
      <stop offset="100%" stop-color="#2c1d4c"/>
    </linearGradient>
    <linearGradient id="platinum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eeeeee"/>
      <stop offset="100%" stop-color="#bdbdbd"/>
    </linearGradient>
  </defs>
  <!-- Outer Platinum Frame -->
  <rect x="3" y="3" width="58" height="58" rx="4" fill="url(#platinum)" stroke="#000000" stroke-width="2"/>
  <path d="M5 56 L5 5 L56 5" fill="none" stroke="#ffffff" stroke-width="2"/>
