  <path d="M10.5 53.5 L10.5 10.5 L53.5 10.5" fill="none" stroke="#08242a" stroke-width="1.5"/>
  <!-- Horizon & Grid -->
  <line x1="10" y1="43" x2="54" y2="43" stroke="#4cc4c4" stroke-width="1" opacity="0.55"/>
  <path d="M12 54 L26 43 M32 54 L32 43 M52 54 L38 43 M10 48 L54 48" stroke="#4cc4c4" stroke-width="1" opacity="0.4"/>
