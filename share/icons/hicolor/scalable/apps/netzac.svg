  <line x1="32" y1="41" x2="32" y2="46" stroke="#f4c6e7" stroke-width="2"/>
  <line x1="15" y1="29" x2="20" y2="29" stroke="#f4c6e7" stroke-width="2"/>
  <line x1="44" y1="29" x2="49" y2="29" stroke="#f4c6e7" stroke-width="2"/>
  <!-- Crisp 'Z' Emblem -->
  <path d="M24 22 L40 22 L40 25 L29 33 L40 33 L40 36 L24 36 L24 33 L35 25 L24 25 Z" fill="#ffffff" stroke="#000000" stroke-width="1"/>
